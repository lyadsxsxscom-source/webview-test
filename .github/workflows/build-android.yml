name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Apply app.config.json
        run: node scripts/apply-config.js

      - name: Add Android platform (only if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generate app icon & splash screen
        run: npx @capacitor/assets generate --android

      - name: Stable signing key
        run: |
          chmod +x scripts/setup-signing.sh
          ./scripts/setup-signing.sh

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a fixed download link (Release)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-debug
          name: "آخر نسخة تجريبية (تتحدث تلقائياً)"
          body: "حمّل ملف app-debug.apk أدناه وثبّته مباشرة. الرابط بيتحدث مع كل تعديل."
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
